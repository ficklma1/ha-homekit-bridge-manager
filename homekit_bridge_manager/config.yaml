name: HomeKit Bridge Manager
version: "1.1.0"
slug: homekit_bridge_manager
description: >-
  One view across every HomeKit bridge. Finds duplicate accessories, round-trip
  re-exports, stale allocations and bridges approaching the 150-accessory limit.
url: https://github.com/ficklma1/ha-homekit-bridge-manager
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# Read-only on the config folder. This is the whole safety story: the add-on
# cannot modify Home Assistant's .storage even if it wanted to.
map:
  - homeassistant_config:ro

homeassistant_api: true
hassio_api: false

ingress: true
ingress_port: 8099
panel_icon: mdi:home-assistant
panel_title: HomeKit Bridges

options:
  refresh_seconds: 300
  log_level: info
  # Integrations you have NOT paired with Apple Home. Listing one here stops the
  # add-on asking whether its devices are duplicated on HomeKit.
  assume_not_in_homekit: []
schema:
  refresh_seconds: int(60,86400)
  log_level: list(trace|debug|info|warning|error|fatal)
  assume_not_in_homekit:
    - str
